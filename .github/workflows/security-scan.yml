name: Image security and integration
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 0 * * 1"
concurrency:
  group: image-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  images:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: indexer
            name: Indexer
            image: olympus-protocol-metrics/indexer:local
          - app: hasura
            name: Hasura
            image: olympus-protocol-metrics/hasura:local
          - app: metrics-api
            name: Metrics API
            image: olympus-protocol-metrics/metrics-api:local
          - app: metrics-publisher
            name: Publisher
            image: olympus-protocol-metrics/metrics-publisher:local
          - app: rpc-cache
            name: RPC cache + integration
            image: localhost/olympus-metrics-rpc-cache:local
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        id: bootstrap
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build ${{ matrix.name }}
        id: build
        run: pnpm run docker:build:${{ matrix.app }}
      - name: Scan ${{ matrix.name }}
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mise exec --locked trivy -- trivy image --scanners vuln,secret \
            --input "" --format table --output "" --severity MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed=true --ignorefile .trivyignore --exit-code 1 "${{ matrix.image }}"
      - name: Check Dockerfile
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          mise exec --locked trivy -- trivy config --format table --output "" \
            --file-patterns "dockerfile:Dockerfile-.*" --severity MEDIUM,HIGH,CRITICAL \
            --exit-code 1 "Dockerfile-${{ matrix.app }}"
      # Keep the expensive eRPC build in one cell. Integration needs four companion
      # builds here, duplicated from their isolated matrix cells: nine builds total.
      - name: Build integration companions
        id: companions
        if: ${{ !cancelled() && matrix.app == 'rpc-cache' && steps.build.outcome == 'success' }}
        run: |
          pnpm run docker:build:indexer
          pnpm run docker:build:hasura
          pnpm run docker:build:metrics-api
          pnpm run docker:build:metrics-publisher
      # Security failures remain red but do not suppress required integration.
      # Integration prepares only its exact DB fixtures, excluded from default scans.
      - name: Prepare required fixtures and test service images
        if: ${{ !cancelled() && matrix.app == 'rpc-cache' && steps.build.outcome == 'success' && steps.companions.outcome == 'success' }}
        run: pnpm run test:integration
