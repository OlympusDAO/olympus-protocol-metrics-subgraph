name: Image security and integration
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
permissions:
  contents: read
jobs:
  images-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build and scan all images and Dockerfiles
        id: images
        run: pnpm run validate:images
      - name: Test those images
        if: ${{ !cancelled() && steps.images.outcome != 'skipped' }}
        run: pnpm run test:integration
