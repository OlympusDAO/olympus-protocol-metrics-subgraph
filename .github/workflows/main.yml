name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: Formatting, lint and workflow checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
      - name: Verify runtime pins
        run: pnpm run check:runtime-versions
      - name: Check formatting, code quality and GitHub Actions
        run: pnpm run check
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
      # Generated Envio types are required by the root typecheck; codegen is offline.
      - name: Generate indexer types
        run: pnpm run codegen
      - name: Typecheck and build packages
        run: pnpm run build
  test:
    name: Unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
      # Jobs have isolated checkouts; tests need their own generated handler types.
      - name: Generate indexer types
        run: pnpm run codegen
      - name: Run ordinary tests
        run: pnpm run test
      # Dependency Audit owns the PR audit; local `validate` still includes it.
