name: Dependency Audit Comment

on:
  workflow_run:
    workflows: ["Dependency Audit"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      # This privileged workflow parses only the bounded report; never checkout or run PR code.
      # Setup failures remain native CI failures; only completed audit reports are published here.
      - name: Download audit result
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: pnpm-audit-result
          path: ${{ runner.temp }}/pnpm-audit-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update pull request comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          AUDIT_RESULT_PATH: ${{ runner.temp }}/pnpm-audit-result/audit.json
          AUDIT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const fs = require("fs");

            const marker = "<!-- pnpm-audit -->";
            const run = context.payload.workflow_run;
            let pullRequests = run.pull_requests;
            // Include closed matches so a result cannot move to another PR on the same fork head.
            if (Array.isArray(pullRequests) && pullRequests.length === 0) {
              if (!run.head_repository?.id || !run.head_repository.owner?.login || !run.head_branch || !run.head_sha) {
                core.setFailed("Missing fork audit head identity");
                return;
              }
              const candidates = await github.paginate(github.rest.pulls.list, {
                ...context.repo, state: "all",
                head: `${run.head_repository.owner.login}:${run.head_branch}`, per_page: 100,
              });
              pullRequests = candidates.filter(candidate => candidate.head?.repo?.id === run.head_repository.id &&
                candidate.head?.ref === run.head_branch && candidate.head?.sha === run.head_sha);
            }
            if (!Array.isArray(pullRequests) || pullRequests.length !== 1) {
              core.setFailed("Expected exactly one pull request for the audit run");
              return;
            }

            const issueNumber = Number(pullRequests[0].number);
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed("Invalid pull request number");
              return;
            }
            const resultPath = process.env.AUDIT_RESULT_PATH;
            const resultSize = fs.statSync(resultPath).size;
            if (resultSize > 1024 * 1024) {
              core.setFailed("Audit result exceeds the 1 MiB safety limit");
              return;
            }

            let result = {};
            try {
              result = JSON.parse(fs.readFileSync(resultPath, "utf8"));
            } catch {
              if (process.env.AUDIT_CONCLUSION === "success") {
                core.setFailed("Successful audit run produced invalid JSON");
                return;
              }
            }
            const advisories = Object.values(result.advisories ?? {});
            const reportable = advisories
              .filter((advisory) =>
                ["moderate", "high", "critical"].includes(advisory.severity)
              )
              .slice(0, 50);

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.type === "Bot" && comment.body?.includes(marker)
            );
            // Check after comment lookup so an older run cannot overwrite a newer head.
            const { data: pullRequest } = await github.rest.pulls.get({
              ...context.repo, pull_number: issueNumber,
            });
            if (pullRequest.state !== "open" || !run.head_sha || pullRequest.head?.sha !== run.head_sha) {
              core.info("Skipping audit result: the pull request closed or its head changed.");
              return;
            }

            if (
              reportable.length === 0 &&
              process.env.AUDIT_CONCLUSION === "success"
            ) {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
              }
              return;
            }

            // Bound single-line fields and neutralize every embedded backtick before
            // wrapping them in code spans, where Markdown and mentions stay inert.
            const escapeMarkdown = (value, limit = 120) =>
              String(value ?? "")
                .replaceAll("`", "'")
                .replace(/[\s\u0000-\u001f\u007f]+/g, " ")
                .trim()
                .slice(0, limit);
            const lines = reportable.map((advisory) => {
              const severity = escapeMarkdown(advisory.severity);
              const packageName = escapeMarkdown(advisory.module_name, 80);
              const title = escapeMarkdown(advisory.title);
              return `- \`${severity}\`: \`${packageName}\`: \`${title}\``;
            });
            if (lines.length === 0) {
              lines.push("- The audit did not complete successfully.");
            }
            const summary =
              reportable.length > 0
                ? "Moderate-or-higher vulnerabilities were found:"
                : "The dependency audit failed before producing a valid report:";
            const body = [
              marker,
              "## pnpm audit",
              "",
              summary,
              "",
              ...lines,
              "",
              `[View audit run](${process.env.WORKFLOW_RUN_URL})`,
            ].join("\n");

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
