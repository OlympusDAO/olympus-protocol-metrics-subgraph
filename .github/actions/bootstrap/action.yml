name: Bootstrap CI environment
description: Standardized repository setup for CI.

inputs:
  mise-version:
    description: Version of the mise tool manager.
    required: false
    default: "2026.11.9"
  install-foundry:
    description: Install foundry toolchain if required by the project.
    required: false
    default: "false"

outputs:
  mise-version:
    description: Mise version selected for this job.
    value: ${{ inputs.mise-version }}

runs:
  using: composite
  steps:
    - name: Install validation tools
      uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5
      with:
        version: ${{ inputs.mise-version }}
        install_args: node pnpm actionlint --locked
        add_shims_to_path: false
        cache: false

    - name: Install Foundry
      if: ${{ inputs.install-foundry == 'true' }}
      uses: foundry-rs/foundry-toolchain@8789b3e21e6c11b2697f5eb56eddae542f746c10 # v1.7.0

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
